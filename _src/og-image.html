<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @font-face{font-family:'SpaceG';src:url('../assets/fonts/space-grotesk-v22-latin-700.ttf');font-weight:700}
  @font-face{font-family:'Plex';src:url('../assets/fonts/ibm-plex-mono-v20-latin-500.ttf');font-weight:500}
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#F5F4F0;position:relative;font-family:'SpaceG'}
  .wm{position:absolute;right:-90px;bottom:-110px;width:460px;opacity:.06}
  .box{position:absolute;inset:0;padding:70px 76px;display:flex;flex-direction:column}
  .lock{display:flex;align-items:center;gap:20px}
  .lock img{height:64px}
  .lock b{font-family:'SpaceG';font-weight:700;font-size:44px;letter-spacing:-0.015em;color:#0E0E12}
  .lock b i{font-style:normal;color:#F0A500}
  .kick{font-family:'Plex';font-weight:500;font-size:19px;letter-spacing:.14em;color:#2743F5;margin-top:auto}
  h1{font-family:'SpaceG';font-weight:700;font-size:74px;line-height:1.06;letter-spacing:-0.025em;color:#0E0E12;margin-top:22px;max-width:980px}
  h1 .dot{color:#F0A500}
  .base{font-family:'Plex';font-weight:500;font-size:17px;letter-spacing:.13em;color:#565660;margin-top:34px;text-transform:uppercase}
</style>
</head>
<body>
<img class="wm" src="../assets/simbolo-prompt.svg">
<div class="box">
  <div class="lock"><img src="../assets/simbolo-prompt.svg"><b>batista<i>.</i>growth</b></div>
  <div class="kick">&gt; growth · comercial · ia aplicada_</div>
  <h1>Crescimento não é feeling. É método, clareza e decisão<span class="dot">.</span></h1>
  <div class="base">gardelbatista.com.br</div>
</div>
</body>
</html>
